<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-db-disc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="logo-db-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="logo-x-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="logo-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (scaled and positioned) -->
  <g transform="translate(10, 10)">
    <!-- Squircle Backdrop -->
    <rect x="0" y="0" width="90" height="90" rx="22" fill="#070a0e" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="2" />
    <circle cx="45" cy="45" r="26" fill="#14b8a6" opacity="0.15" filter="url(#logo-glow)" />

    <!-- DB stack -->
    <g transform="translate(12, 16)">
      <!-- Disc 3 -->
      <path d="M8 36 C8 31 36 31 36 36 L36 46 C36 51 8 51 8 46 Z" fill="url(#logo-db-disc)" opacity="0.8" />
      <path d="M8 46 C8 51 36 51 36 46" stroke="#2dd4bf" stroke-width="1.3" fill="none" opacity="0.5" />
      <!-- Disc 2 -->
      <path d="M8 24 C8 19 36 19 36 24 L36 34 C36 39 8 39 8 34 Z" fill="url(#logo-db-disc)" opacity="0.9" />
      <path d="M8 34 C8 39 36 39 36 34" stroke="#2dd4bf" stroke-width="1.3" fill="none" opacity="0.7" />
      <!-- Disc 1 -->
      <path d="M8 12 C8 7 36 7 36 12 L36 22 C36 27 8 27 8 22 Z" fill="url(#logo-db-disc)" />
      <ellipse cx="22" cy="12" rx="14" ry="5.5" fill="url(#logo-db-top)" />
    </g>

    <!-- X mark -->
    <g filter="url(#logo-glow)">
      <path d="M38 24 L47 24 L61 45 L75 24 L84 24 L67 49 L85 74 L76 74 L60 51 L44 74 L35 74 L54 47 Z"
            fill="url(#logo-x-grad)" stroke="#090d16" stroke-width="1.2" />
    </g>
    <!-- Accent node -->
    <circle cx="84" cy="24" r="2.5" fill="#5eead4" filter="url(#logo-glow)" />
  </g>

  <!-- Typography -->
  <g transform="translate(120, 60)">
    <!-- xphpMyAdmin main logotype -->
    <text font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="38"
          font-weight="800"
          letter-spacing="-0.03em"
          fill="url(#logo-text-grad)">
      <tspan fill="#2dd4bf">x</tspan>phpMyAdmin
    </text>

    <!-- Luminous dot on top of the 'i' -->
    <circle cx="218" cy="-26" r="3" fill="#2dd4bf" filter="url(#logo-glow)" />

    <!-- Subtitle: DESKTOP STUDIO -->
    <text y="24"
          font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="12"
          font-weight="700"
          letter-spacing="0.28em"
          fill="#14b8a6">
      DESKTOP STUDIO
    </text>
  </g>
</svg>
