name: Publish Release

on:
  workflow_dispatch:

jobs:
  publish-release:
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            target: mac-apple-silicon
          - os: macos-13
            arch: x64
            target: mac-intel
          - os: ubuntu-latest
            arch: x64
            target: linux-x64
          - os: windows-latest
            arch: x64
            target: win-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v6

      - name: Install Node and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Publish Release (${{ matrix.target }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn electron-forge publish --arch=${{ matrix.arch }}
